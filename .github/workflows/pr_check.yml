name: PR Build Check

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  style-gates:
    name: Style Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # House standard: emoji are a failure state; only the Kare icon set is permitted.
      # The checker is VENDORED under tools/house_gates/ rather than fetched: this project is
      # public and must gate itself with nothing but its own checkout, so that CI passes for a
      # fork and a contributor can run the same check locally.
      - name: No-emoji gate
        run: python3 tools/house_gates/check_no_emoji.py

  build-and-test-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libgtk-4-dev libsdl2-dev libsdl2-mixer-dev libgdk-pixbuf-2.0-dev libwayland-dev libx11-dev libxtst-dev
      - name: Configure
        run: rm -rf build && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel $(nproc)
      # Tests are macOS-only (behaviors have CoreGraphics dependencies)
      # - name: Test
      #   run: |
      #     cd build
      #     ctest --output-on-failure -j$(nproc)
