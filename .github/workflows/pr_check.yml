name: PR Build Check

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  style-gates:
    name: Style Gates
    runs-on: ubuntu-26.04
    steps:
      # persist-credentials: false on EVERY checkout in this file: by default
      # checkout leaves the job token in git config (http.<host>.extraheader),
      # readable by every later step and refused by the gates_of_heck structural
      # gate's no-credential-in-git-config check (2026-10-08).
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The house gate suite is a public repo; CI and forks fetch it rather than
      # carrying copies (copies drift, and the copy is what the gate then means).
      - name: Fetch the house gate suite
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          repository: ztomer/gates_of_heck
          path: .goh
      # Structural gates: emoji (only the Kare icon set), conflict markers,
      # file length, shell lint, secrets -- the same run the pre-commit hook does.
      - name: Structural gates
        run: GOH_DIR="$PWD/.goh" bash .goh/gates/structural.sh --full

  build-and-test-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq $(grep -v '^#' scripts/linux_apt_packages.txt)
      - name: Configure
        run: rm -rf build && cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel $(nproc)
      # The Linux suite (ROADMAP M1.5). This step was commented out because the
      # macOS suite links ObjC++ and Cocoa; cmake/TestsLinux.cmake builds the
      # portable config layer into its own binary instead, so Linux-only
      # defects have something that can go red.
      - name: Test (Linux suite, M1.5)
        run: bash scripts/run_tests_linux.sh
