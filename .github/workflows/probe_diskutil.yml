name: Probe diskutil image (G0.17, throwaway)

on:
  push:
    branches: [wf-g017]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Does diskutil image create/attach exist on this runner?
        run: |
          set -x
          sw_vers
          diskutil image create from --help || echo "PROBE: create-from MISSING ($?)"
          diskutil image attach --help | head -5 || echo "PROBE: attach MISSING"
          S="$RUNNER_TEMP/p"; mkdir -p "$S/stage/X.app/Contents/MacOS"
          echo hi > "$S/stage/X.app/Contents/MacOS/x"
          diskutil image create from --format UDZO --volumeName CadGoose "$S/stage" "$S/out.dmg"; echo "PROBE create exit=$?"
          diskutil image attach --readOnly --nobrowse --mountPoint "$S/mnt" "$S/out.dmg"; echo "PROBE attach exit=$?"
          ls -la "$S/mnt"
          diskutil eject "$S/mnt"; echo "PROBE eject exit=$?"
          hdiutil create -volname CadGoose -srcfolder "$S/stage/X.app" -ov -format UDZO "$S/old.dmg" 2>&1 | tee "$S/hd.log"
          grep -i deprecated "$S/hd.log" && echo "PROBE hdiutil deprecated on runner" || echo "PROBE hdiutil not deprecated on runner"
