name: Build & Release Artifacts

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the built artifacts to (e.g. v1.9). Leave blank to only build artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ── macOS ──────────────────────────────────────────────
  build-macos:
    name: Build macOS (DMG)
    # macos-26 ships the macOS 26 SDK, which contains FoundationModels — required
    # for the local "Foundation" AI provider to be compiled into the binary.
    runs-on: macos-26
    steps:
      # persist-credentials: false on EVERY checkout in this file: by default
      # checkout leaves the job token in git config (http.<host>.extraheader),
      # readable by every later step and refused by the gates_of_heck structural
      # gate's no-credential-in-git-config check (2026-10-08).
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Full history so `git describe --tags` can name the version: a
          # shallow clone has no tags, and CMake then stamps the short sha into
          # --version, which scripts/check_quiet_version.sh rightly refuses.
          fetch-depth: 0

      # FoundationModels (the local "Foundation" AI provider) only exists in the
      # macOS 26+ SDK. canImport() is evaluated at compile time, so building
      # against an older SDK silently strips the backend out of the DMG. Select
      # the newest Xcode the runner offers to maximize the chance of an SDK that
      # includes FoundationModels.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: brew install cmake googletest ccache

      - name: Verify FoundationModels SDK support
        run: |
          echo "Xcode: $(xcodebuild -version | head -1)"
          SDK_PATH="$(xcrun --show-sdk-path)"
          echo "SDK: $SDK_PATH (version $(xcrun --show-sdk-version))"
          printf '#if canImport(FoundationModels)\n#warning("FoundationModels present in SDK")\n#else\n#warning("FoundationModels MISSING from SDK")\n#endif\n' > /tmp/fmcheck.swift
          if swiftc -typecheck /tmp/fmcheck.swift -sdk "$SDK_PATH" 2>&1 | grep -q "FoundationModels present"; then
            echo "✓ FoundationModels available — local Foundation provider will work in this build"
          else
            echo "::warning title=Foundation provider disabled::This SDK lacks FoundationModels; the released DMG will NOT support the local Foundation AI provider. Use a runner/Xcode with the macOS 26+ SDK."
          fi

      - name: Cache ccache
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure & Build
        run: |
          rm -rf build && mkdir -p build && cd build
          # Release build: compile out all debug-level logging (CG_DISABLE_DEBUG_LOG).
          # Applies to the CadGoose app target only; CadGooseTests keeps full logging.
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCG_DISABLE_DEBUG_LOG=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build . --config Release --parallel $(sysctl -n hw.logicalcpu)

      # The shipped binary prints nothing but its version for --version: a
      # stray debug print in main() once did (scripts/check_quiet_version.sh).
      - name: Release binary is quiet
        run: |
          bash tests/profiling/test_check_quiet_version.sh
          bash scripts/check_quiet_version.sh build/CadGoose

      - name: Run Tests (fast; two concurrent copies, G0.3)
        run: |
          cd build
          bash ../scripts/run_tests_concurrent.sh

      - name: Run Tests (three shuffled orders, G0.13)
        run: |
          cd build
          bash ../scripts/run_tests_shuffled.sh

      - name: Run Tests (ThreadSanitizer, M1.2)
        run: |
          cd build
          bash ../scripts/run_tests_tsan.sh

      # The profiling harness, driven on fakes: it waits on the socket the
      # binary names and restores the desktop on every exit (run_trail_test.sh).
      - name: Profiling scripts restore the desktop and find the app's socket
        run: bash tests/profiling/test_run_trail_test.sh

      # The coverage floors live in scripts/check_coverage.sh and nowhere
      # else (G0.8). They are a RATCHET set below the measured value (G0.1
      # measured P0 95.22%, P1 26.75%, eligible total 63.93% on 2026-10-16),
      # not an aspiration; they exist to fail the build on a REGRESSION.
      #
      # The ~1pp gap is deliberate. Coverage here is not perfectly
      # deterministic: repeated runs of the same commit have varied by up to
      # 0.4pp on P1 (timing-sensitive async-log tests, randomised behavior
      # tests). A threshold pressed right up against the measured value would
      # go red on noise, and a gate that cries wolf gets switched off — which
      # costs more than the 1pp it buys. Keep roughly 1pp of headroom when
      # raising these.
      #
      # Raise as coverage lands; never lower them to make a red build green.
      - name: Fetch the house gate suite
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          repository: ztomer/gates_of_heck
          path: .goh
      - name: Test registration gate
        run: GOH_DIR="$PWD/.goh" python3 tools/check_test_registration.py
      - name: Tests never mutate process env or cwd (G0.12)
        run: python3 tools/check_test_process_state.py
      - name: Platform policy accepts and rejects what it should (G0.5)
        run: python3 tools/check_platform_policy.py
      - name: Tests bind no fixed port or socket path (G0.3)
        run: python3 tools/check_test_endpoints.py
      - name: The app's settings directory is its own (D1.1)
        run: python3 tools/check_config_dir_isolation.py
      - name: CI pins named releases, no moving references (G0.6)
        run: python3 tools/check_ci_pins.py
      - name: Every CI gate also runs in the local pre-push gate (G0.16)
        run: GOH_DIR="$PWD/.goh" python3 .goh/checks/check_ci_local_parity.py

      - name: Coverage Gate
        run: |
          bash scripts/check_coverage.sh --build-dir=build-cov

      - name: Determine version
        uses: ./.github/actions/determine-version
        with:
          release_tag: ${{ inputs.release_tag }}

      - name: Create App Bundle
        run: |
          chmod +x scripts/create_bundle.sh
          BUNDLE_VERSION="${VERSION#v}" ./scripts/create_bundle.sh --clean

      # diskutil image, not `hdiutil create`: deprecated on macOS 27 (G0.17).
      # Probed on this runner (macos-26, 26.6.2) on 2026-10-18 before moving:
      # `diskutil image create from` exists there and makes a UDZO image. A
      # folder source becomes the volume root, so the .app is staged in one,
      # and the destination is removed first (there is no -ov).
      - name: Create DMG
        run: |
          stage="$RUNNER_TEMP/dmg-root"
          rm -rf "$stage" "build/CadGoose-${VERSION}.dmg" && mkdir -p "$stage"
          ditto build/CadGoose.app "$stage/CadGoose.app"
          diskutil image create from --format UDZO --volumeName CadGoose "$stage" "build/CadGoose-${VERSION}.dmg"

      # The shipped artifact, not the tree: mount the DMG and hold its plist
      # and the minos of every Mach-O inside it to cmake/MacOSFloor.cmake
      # (G0.14). --probe first proves the check can go red on this runner.
      - name: The DMG is built for the macOS floor it claims (G0.14)
        run: python3 tools/check_macos_floor.py --dmg "build/CadGoose-${VERSION}.dmg" --probe

      - name: Upload DMG (artifact)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: CadGoose-macOS-${{ env.VERSION }}
          path: build/CadGoose-${{ env.VERSION }}.dmg
          retention-days: 30

      - name: Upload DMG to Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: |
          TAG="${{ github.event.release.tag_name || inputs.release_tag }}"
          echo "Attaching CadGoose-${VERSION}.dmg to release $TAG"
          gh release upload "$TAG" "build/CadGoose-${VERSION}.dmg" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Linux ──────────────────────────────────────────────
  build-linux:
    name: Build Linux (tar.zst)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq $(grep -v '^#' scripts/linux_apt_packages.txt)

      - name: Configure & Build
        run: |
          rm -rf build && mkdir -p build && cd build
          # Release build: compile out all debug-level logging (CG_DISABLE_DEBUG_LOG).
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCG_DISABLE_DEBUG_LOG=ON
          cmake --build . --config Release --parallel $(nproc)

      # The Linux suite (M1.5), on the build that ships: configure needs GTest
      # since cmake/TestsLinux.cmake, which this job lacked when it went red.
      - name: Test (Linux suite, M1.5)
        run: bash scripts/run_tests_linux.sh

      - name: Fetch the house gate suite
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          repository: ztomer/gates_of_heck
          path: .goh
      - name: Test registration gate
        run: GOH_DIR="$PWD/.goh" python3 tools/check_test_registration.py

      - name: Determine version
        uses: ./.github/actions/determine-version
        with:
          release_tag: ${{ inputs.release_tag }}

      - name: Package binary
        run: |
          mkdir -p cadgoose-linux/{bin,config,Assets}
          cp build/CadGoose cadgoose-linux/bin/
          cp -r config/* cadgoose-linux/config/ 2>/dev/null || true
          cp -r Assets/* cadgoose-linux/Assets/ 2>/dev/null || true
          tar --zstd -cf "CadGoose-${VERSION}-linux.tar.zst" cadgoose-linux

      - name: Upload tar.zst (artifact)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: CadGoose-Linux-${{ env.VERSION }}
          path: CadGoose-${{ env.VERSION }}-linux.tar.zst
          retention-days: 30

      - name: Upload tar.zst to Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: |
          TAG="${{ github.event.release.tag_name || inputs.release_tag }}"
          echo "Attaching CadGoose-${VERSION}-linux.tar.zst to release $TAG"
          gh release upload "$TAG" "CadGoose-${VERSION}-linux.tar.zst" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
